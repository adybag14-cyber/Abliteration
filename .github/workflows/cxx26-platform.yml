name: C++26 platform — multi-target build, test, deploy

# Native ISO C++26 binaries. A target that cannot compile -std=c++26 fails.
# Linux x64/arm64 (GCC 16.2 + Clang 22), Windows x64 (Clang 22 + MSVC 14.51),
# Windows arm64 (VS 2026 MSVC, preview runner), macOS arm64 + x64 (Homebrew LLVM 22).

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "cxx/**"
      - "scripts/build-cxx.mjs"
      - "scripts/package-cxx.mjs"
      - "scripts/smoke-cxx-package.mjs"
      - "scripts/run-cxx-*.mjs"
      - ".github/workflows/cxx26-platform.yml"
  pull_request:
    branches: [main]
    paths:
      - "cxx/**"
      - "scripts/build-cxx.mjs"
      - "scripts/package-cxx.mjs"
      - "scripts/smoke-cxx-package.mjs"
      - "scripts/run-cxx-*.mjs"
      - ".github/workflows/cxx26-platform.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cxx26-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  linux-gcc:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: gcc:16.2
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64-gcc16
            os: ubuntu-24.04
            triple: linux-x64
          - name: linux-arm64-gcc16
            os: ubuntu-24.04-arm
            triple: linux-arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build ca-certificates git nodejs
          g++ --version
          test "$(g++ -dumpfullversion -dumpversion | cut -d. -f1)" = 16
          node --version
      - name: Configure and build
        run: |
          cmake -S cxx -B cxx/ci-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++ \
            -DABLITERATE_TARGET=${{ matrix.triple }}
          cmake --build cxx/ci-build --config Release -v
      - name: Prove C++26 + test
        run: |
          cxx/ci-build/abliterate-cxx-dialect | tee dialect.txt
          grep -E 'cplusplus=202400' dialect.txt
          cxx/ci-build/abliterate-cxx version
          cxx/ci-build/abliterate-cxx-tests
          cxx/ci-build/abliterate-cxx self-check | tee self1.txt
          cxx/ci-build/abliterate-cxx self-check | tee self2.txt
          diff -u self1.txt self2.txt
          grep '"ok":true' self1.txt
          ctest --test-dir cxx/ci-build --output-on-failure
      - name: Package
        run: |
          if command -v node >/dev/null 2>&1; then
            node scripts/package-cxx.mjs --build-dir cxx/ci-build --triple ${{ matrix.triple }} --compiler ${{ matrix.name }}
          else
            bash cxx/package.sh cxx/ci-build ${{ matrix.triple }} ${{ matrix.name }}
          fi
      - name: Smoke — unpack archive away from the repo and run first hour
        run: node scripts/smoke-cxx-package.mjs --archive cxx/dist/abliterate-cxx-${{ matrix.name }}.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: abliterate-cxx-${{ matrix.name }}
          path: cxx/dist/abliterate-cxx-${{ matrix.name }}*
          if-no-files-found: error
          retention-days: 30

  hosted:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64-clang22
            os: ubuntu-24.04
            compiler: clang++
            llvm: "22"
            triple: linux-x64
            experimental: false
          - name: linux-arm64-clang22
            os: ubuntu-24.04-arm
            compiler: clang++
            llvm: "22"
            triple: linux-arm64
            experimental: false
          - name: windows-x64-clang22
            os: windows-2025-vs2026
            compiler: clang++
            llvm: "22"
            triple: windows-x64
            experimental: false
          - name: windows-x64-msvc
            os: windows-2025-vs2026
            compiler: cl
            triple: windows-x64
            msvc_arch: x64
            experimental: false
          - name: windows-arm64-msvc
            os: windows-11-vs2026-arm
            compiler: cl
            triple: windows-arm64
            msvc_arch: amd64_arm64
            experimental: true
          - name: macos-arm64-llvm
            os: macos-latest
            compiler: clang++
            brew_llvm: true
            triple: macos-arm64
            osx_arch: arm64
            experimental: false
          - name: macos-x64-llvm
            os: macos-latest
            compiler: clang++
            brew_llvm: true
            triple: macos-x64
            osx_arch: x86_64
            experimental: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux' && matrix.llvm
        run: |
          set -euo pipefail
          if command -v "clang++-${{ matrix.llvm }}" >/dev/null 2>&1; then
            echo "CXX=clang++-${{ matrix.llvm }}" >> "$GITHUB_ENV"
            echo "CC=clang-${{ matrix.llvm }}" >> "$GITHUB_ENV"
            exit 0
          fi
          curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.llvm }} all
          echo "CXX=clang++-${{ matrix.llvm }}" >> "$GITHUB_ENV"
          echo "CC=clang-${{ matrix.llvm }}" >> "$GITHUB_ENV"
          clang++-${{ matrix.llvm }} --version

      - name: Cache verified LLVM 22.1.8 archive (Windows)
        if: runner.os == 'Windows' && matrix.llvm
        uses: actions/cache@v6
        with:
          path: .ci-cache/LLVM-22.1.8-win64.exe
          key: llvm-22.1.8-win64-16e5709785fef73c

      - name: Extract verified LLVM 22.1.8 (Windows)
        if: runner.os == 'Windows' && matrix.llvm
        run: |
          set -euo pipefail
          URL=https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-win64.exe
          SHA256=16e5709785fef73c854646241c4a92c5cd574318d1b33c63330dd7721903e55c
          ARCHIVE="$GITHUB_WORKSPACE/.ci-cache/LLVM-22.1.8-win64.exe"
          LLVM_ROOT="$RUNNER_TEMP/llvm-22.1.8"
          mkdir -p "$(dirname "$ARCHIVE")" "$LLVM_ROOT"
          if [[ ! -f "$ARCHIVE" ]]; then
            curl -fsSL --retry 8 --retry-all-errors --retry-delay 2 -o "$ARCHIVE" "$URL"
          fi
          echo "$SHA256 *$ARCHIVE" | sha256sum -c -
          # The official installer is an NSIS archive. Extracting it avoids
          # mutating or colliding with the runner image's preinstalled LLVM.
          7z x -y "$ARCHIVE" "-o${LLVM_ROOT}" '-x!Uninstall.exe' '-x!$PLUGINSDIR\*'
          test -x "$LLVM_ROOT/bin/clang++.exe"
          echo "$LLVM_ROOT/bin" >> "$GITHUB_PATH"
          echo "CXX=$LLVM_ROOT/bin/clang++.exe" >> "$GITHUB_ENV"
          "$LLVM_ROOT/bin/clang++.exe" --version

      - name: Install Homebrew LLVM
        if: matrix.brew_llvm
        run: |
          brew update
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "CC=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix llvm)/bin/clang++" >> "$GITHUB_ENV"

      - name: Install Ninja (Linux apt — works on x64 and arm64)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (Windows/macOS)
        if: runner.os != 'Linux'
        run: |
          set -euo pipefail
          if command -v ninja >/dev/null 2>&1; then
            ninja --version
            exit 0
          fi
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            brew install ninja
            ninja --version
            exit 0
          fi
          # Hosted Windows images often already have ninja; do not depend on a
          # third-party ninja setup action (Node 20 + unretried github.com download).
          CANDIDATES=(
            "/c/ProgramData/Chocolatey/bin/ninja.exe"
            "/c/Tools/Ninja/ninja.exe"
            "/c/Program Files/Microsoft Visual Studio/18/Enterprise/Common7/IDE/CommonExtensions/Microsoft/CMake/Ninja/ninja.exe"
            "/c/Program Files/Microsoft Visual Studio/2022/Enterprise/Common7/IDE/CommonExtensions/Microsoft/CMake/Ninja/ninja.exe"
          )
          for n in "${CANDIDATES[@]}"; do
            if [[ -x "$n" ]]; then
              echo "$(dirname "$n")" >> "$GITHUB_PATH"
              "$n" --version
              exit 0
            fi
          done
          DEST="${GITHUB_WORKSPACE}/ninja-build"
          mkdir -p "$DEST"
          case "${{ runner.arch }}" in
            ARM64) ZIP=ninja-winarm64.zip ;;
            *) ZIP=ninja-win.zip ;;
          esac
          URL="https://github.com/ninja-build/ninja/releases/download/v1.12.1/${ZIP}"
          echo "downloading ${URL}"
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 2 -o "$DEST/ninja.zip" "$URL"
          unzip -o "$DEST/ninja.zip" -d "$DEST"
          echo "$DEST" >> "$GITHUB_PATH"
          "$DEST/ninja.exe" --version

      - name: MSVC developer environment
        if: matrix.compiler == 'cl'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Prove current compiler generation
        run: |
          if [[ "${{ matrix.compiler }}" == "cl" ]]; then
            cl 2>&1 | tee compiler.txt || true
            grep -E 'Version 19\.5[1-9]' compiler.txt
          else
            "${CXX:-clang++}" --version | tee compiler.txt
            grep -E 'clang version 22\.' compiler.txt
          fi

      - name: Configure and build (Clang)
        if: matrix.compiler == 'clang++'
        run: |
          CXX_BIN="${CXX:-clang++}"
          EXTRA=()
          if [[ -n "${{ matrix.osx_arch }}" ]]; then
            EXTRA+=(-DCMAKE_OSX_ARCHITECTURES=${{ matrix.osx_arch }})
          fi
          cmake -S cxx -B cxx/ci-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="$CXX_BIN" \
            -DABLITERATE_TARGET=${{ matrix.triple }} \
            "${EXTRA[@]}"
          cmake --build cxx/ci-build --config Release -v

      - name: Configure and build (MSVC)
        if: matrix.compiler == 'cl'
        run: |
          cmake -S cxx -B cxx/ci-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=cl \
            -DABLITERATE_TARGET=${{ matrix.triple }}
          cmake --build cxx/ci-build --config Release -v

      - name: Prove C++26 + test
        run: |
          RUN=()
          if [[ "${{ matrix.osx_arch }}" == "x86_64" ]]; then
            RUN=(arch -x86_64)
          fi
          "${RUN[@]}" cxx/ci-build/abliterate-cxx-dialect | tee dialect.txt
          grep -E 'cplusplus=202400' dialect.txt
          "${RUN[@]}" cxx/ci-build/abliterate-cxx version
          "${RUN[@]}" cxx/ci-build/abliterate-cxx-tests
          "${RUN[@]}" cxx/ci-build/abliterate-cxx self-check | tee self1.txt
          "${RUN[@]}" cxx/ci-build/abliterate-cxx self-check | tee self2.txt
          diff -u self1.txt self2.txt
          grep '"ok":true' self1.txt
          if [[ "${{ matrix.osx_arch }}" != "x86_64" ]]; then
            ctest --test-dir cxx/ci-build --output-on-failure
          fi

      - name: Package
        run: node scripts/package-cxx.mjs --build-dir cxx/ci-build --triple ${{ matrix.triple }} --compiler ${{ matrix.name }}

      - name: Smoke — unpack archive away from the repo and run first hour
        run: |
          WRAP=()
          if [[ "${{ matrix.osx_arch }}" == "x86_64" ]]; then WRAP=(--wrap "arch -x86_64"); fi
          node scripts/smoke-cxx-package.mjs --archive cxx/dist/abliterate-cxx-${{ matrix.name }}.tar.gz "${WRAP[@]}"
          if [[ "${{ matrix.triple }}" == windows-* ]]; then
            test -f cxx/dist/abliterate-cxx-${{ matrix.name }}.zip
            node scripts/smoke-cxx-package.mjs --archive cxx/dist/abliterate-cxx-${{ matrix.name }}.zip "${WRAP[@]}"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: abliterate-cxx-${{ matrix.name }}
          path: cxx/dist/abliterate-cxx-${{ matrix.name }}*
          if-no-files-found: error
          retention-days: 30

  sanitizers:
    name: linux-x64-clang22-asan-ubsan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install LLVM 22 and Ninja
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22 all
          sudo apt-get update
          sudo apt-get install -y ninja-build
          clang++-22 --version | tee compiler.txt
          grep -E 'clang version 22\.' compiler.txt
      - name: Run hostile-input suites under ASan and UBSan
        env:
          CXX: clang++-22
        run: npm run cxx:sanitize

  publish:
    name: Deploy multi-platform packages
    needs: [linux-gcc, hosted, sanitizers]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: collected
          pattern: abliterate-cxx-*
      - name: Flatten release directory (fail on name collisions)
        run: |
          mkdir -p release
          while IFS= read -r f; do
            base="$(basename "$f")"
            if [[ -e "release/$base" ]]; then
              echo "collision: $base already in release/" >&2
              exit 1
            fi
            cp -v "$f" "release/$base"
          done < <(find collected -type f \( -name '*.tar.gz' -o -name '*.zip' \))
          ls -la release
          test "$(find release -type f | wc -l)" -ge 8
          (cd release && sha256sum * | tee SHA256SUMS)
          test -s release/SHA256SUMS
      - name: Attest release archives
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: release/*
      - name: Publish rolling cxx-nightly (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f cxx-nightly
          git push -f origin cxx-nightly
          if gh release view cxx-nightly >/dev/null 2>&1; then
            gh release upload cxx-nightly release/* --clobber
            gh release edit cxx-nightly --prerelease \
              --title "abliterate-cxx nightly (all platforms)" \
              --notes-file cxx/RELEASE-NOTES.md
            expected="$(find release -maxdepth 1 -type f -printf '%f\n' | sort)"
            while IFS= read -r asset; do
              if ! grep -Fxq "$asset" <<<"$expected"; then
                gh release delete-asset cxx-nightly "$asset" --yes
              fi
            done < <(gh release view cxx-nightly --json assets --jq '.assets[].name')
          else
            gh release create cxx-nightly release/* \
              --prerelease \
              --title "abliterate-cxx nightly (all platforms)" \
              --notes-file cxx/RELEASE-NOTES.md
          fi
      - name: Publish version tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --title "abliterate-cxx ${GITHUB_REF_NAME}" \
            --notes "Multi-platform ISO C++26 abliterate-cxx. docs/cxx26-platform.md"
