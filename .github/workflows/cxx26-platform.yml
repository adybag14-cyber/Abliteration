name: C++26 platform — multi-target build, test, deploy

# Native ISO C++26 binaries. A target that cannot compile -std=c++26 fails.
# Linux x64/arm64 (GCC 15 + Clang 20), Windows x64 (Clang + MSVC), Windows arm64
# (MSVC, experimental runner), macOS arm64 + x64 (Homebrew LLVM).

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "cxx/**"
      - "scripts/build-cxx.mjs"
      - "scripts/package-cxx.mjs"
      - "scripts/smoke-cxx-package.mjs"
      - "scripts/run-cxx-*.mjs"
      - ".github/workflows/cxx26-platform.yml"
  pull_request:
    branches: [main]
    paths:
      - "cxx/**"
      - "scripts/build-cxx.mjs"
      - "scripts/package-cxx.mjs"
      - "scripts/smoke-cxx-package.mjs"
      - "scripts/run-cxx-*.mjs"
      - ".github/workflows/cxx26-platform.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cxx26-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  linux-gcc:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: gcc:15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64-gcc15
            os: ubuntu-24.04
            triple: linux-x64
          - name: linux-arm64-gcc15
            os: ubuntu-24.04-arm
            triple: linux-arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build ca-certificates git nodejs
          g++ --version
          node --version
      - name: Configure and build
        run: |
          cmake -S cxx -B cxx/ci-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++ \
            -DABLITERATE_TARGET=${{ matrix.triple }}
          cmake --build cxx/ci-build --config Release -v
      - name: Prove C++26 + test
        run: |
          cxx/ci-build/abliterate-cxx-dialect | tee dialect.txt
          grep -E 'cplusplus=202400' dialect.txt
          cxx/ci-build/abliterate-cxx version
          cxx/ci-build/abliterate-cxx-tests
          cxx/ci-build/abliterate-cxx self-check | tee self1.txt
          cxx/ci-build/abliterate-cxx self-check | tee self2.txt
          diff -u self1.txt self2.txt
          grep '"ok":true' self1.txt
          ctest --test-dir cxx/ci-build --output-on-failure
      - name: Package
        run: |
          if command -v node >/dev/null 2>&1; then
            node scripts/package-cxx.mjs --build-dir cxx/ci-build --triple ${{ matrix.triple }} --compiler ${{ matrix.name }}
          else
            bash cxx/package.sh cxx/ci-build ${{ matrix.triple }} ${{ matrix.name }}
          fi
      - name: Smoke — unpack archive away from the repo and run first hour
        run: node scripts/smoke-cxx-package.mjs --archive cxx/dist/abliterate-cxx-${{ matrix.name }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: abliterate-cxx-${{ matrix.name }}
          path: cxx/dist/abliterate-cxx-${{ matrix.name }}*
          if-no-files-found: error
          retention-days: 30

  hosted:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64-clang20
            os: ubuntu-24.04
            compiler: clang++
            llvm: "20"
            triple: linux-x64
            experimental: false
          - name: linux-arm64-clang20
            os: ubuntu-24.04-arm
            compiler: clang++
            llvm: "20"
            triple: linux-arm64
            experimental: false
          - name: windows-x64-clang
            os: windows-latest
            compiler: clang++
            llvm: "20"
            triple: windows-x64
            experimental: false
          - name: windows-x64-msvc
            os: windows-latest
            compiler: cl
            triple: windows-x64
            experimental: false
          - name: windows-arm64-msvc
            os: windows-11-arm
            compiler: cl
            triple: windows-arm64
            experimental: true
          - name: macos-arm64-llvm
            os: macos-latest
            compiler: clang++
            brew_llvm: true
            triple: macos-arm64
            osx_arch: arm64
            experimental: false
          - name: macos-x64-llvm
            os: macos-latest
            compiler: clang++
            brew_llvm: true
            triple: macos-x64
            osx_arch: x86_64
            experimental: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux' && matrix.llvm
        run: |
          set -euo pipefail
          if command -v "clang-${{ matrix.llvm }}" >/dev/null 2>&1; then
            echo "CXX=clang-${{ matrix.llvm }}" >> "$GITHUB_ENV"
            echo "CC=clang-${{ matrix.llvm }}" >> "$GITHUB_ENV"
            exit 0
          fi
          curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.llvm }} all
          echo "CXX=clang++-${{ matrix.llvm }}" >> "$GITHUB_ENV"
          echo "CC=clang-${{ matrix.llvm }}" >> "$GITHUB_ENV"
          clang++-${{ matrix.llvm }} --version

      - name: Use preinstalled LLVM (Windows)
        if: runner.os == 'Windows' && matrix.llvm
        run: |
          if [[ -x "/c/Program Files/LLVM/bin/clang++.exe" ]]; then
            echo "/c/Program Files/LLVM/bin" >> "$GITHUB_PATH"
            echo "CXX=clang++" >> "$GITHUB_ENV"
            "/c/Program Files/LLVM/bin/clang++.exe" --version
          else
            echo "LLVM not preinstalled" >&2
            exit 1
          fi

      - name: Install Homebrew LLVM
        if: matrix.brew_llvm
        run: |
          brew update
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "CC=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix llvm)/bin/clang++" >> "$GITHUB_ENV"

      - name: Install Ninja (Linux apt — works on x64 and arm64)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (Windows/macOS)
        if: runner.os != 'Linux'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: MSVC developer environment
        if: matrix.compiler == 'cl'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure and build (Clang)
        if: matrix.compiler == 'clang++'
        run: |
          CXX_BIN="${CXX:-clang++}"
          EXTRA=()
          if [[ -n "${{ matrix.osx_arch }}" ]]; then
            EXTRA+=(-DCMAKE_OSX_ARCHITECTURES=${{ matrix.osx_arch }})
          fi
          cmake -S cxx -B cxx/ci-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="$CXX_BIN" \
            -DABLITERATE_TARGET=${{ matrix.triple }} \
            "${EXTRA[@]}"
          cmake --build cxx/ci-build --config Release -v

      - name: Configure and build (MSVC)
        if: matrix.compiler == 'cl'
        run: |
          cmake -S cxx -B cxx/ci-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=cl \
            -DABLITERATE_TARGET=${{ matrix.triple }}
          cmake --build cxx/ci-build --config Release -v

      - name: Prove C++26 + test
        run: |
          RUN=()
          if [[ "${{ matrix.osx_arch }}" == "x86_64" ]]; then
            RUN=(arch -x86_64)
          fi
          "${RUN[@]}" cxx/ci-build/abliterate-cxx-dialect | tee dialect.txt
          grep -E 'cplusplus=202400' dialect.txt
          "${RUN[@]}" cxx/ci-build/abliterate-cxx version
          "${RUN[@]}" cxx/ci-build/abliterate-cxx-tests
          "${RUN[@]}" cxx/ci-build/abliterate-cxx self-check | tee self1.txt
          "${RUN[@]}" cxx/ci-build/abliterate-cxx self-check | tee self2.txt
          diff -u self1.txt self2.txt
          grep '"ok":true' self1.txt
          if [[ "${{ matrix.osx_arch }}" != "x86_64" ]]; then
            ctest --test-dir cxx/ci-build --output-on-failure
          fi

      - name: Package
        run: node scripts/package-cxx.mjs --build-dir cxx/ci-build --triple ${{ matrix.triple }} --compiler ${{ matrix.name }}

      - name: Smoke — unpack archive away from the repo and run first hour
        run: |
          WRAP=()
          if [[ "${{ matrix.osx_arch }}" == "x86_64" ]]; then WRAP=(--wrap "arch -x86_64"); fi
          node scripts/smoke-cxx-package.mjs --archive cxx/dist/abliterate-cxx-${{ matrix.name }}.tar.gz "${WRAP[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: abliterate-cxx-${{ matrix.name }}
          path: cxx/dist/abliterate-cxx-${{ matrix.name }}*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Deploy multi-platform packages
    needs: [linux-gcc, hosted]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: collected
          pattern: abliterate-cxx-*
      - name: Flatten release directory (fail on name collisions)
        run: |
          mkdir -p release
          while IFS= read -r f; do
            base="$(basename "$f")"
            if [[ -e "release/$base" ]]; then
              echo "collision: $base already in release/" >&2
              exit 1
            fi
            cp -v "$f" "release/$base"
          done < <(find collected -type f \( -name '*.tar.gz' -o -name '*.zip' \))
          ls -la release
          test "$(find release -type f | wc -l)" -ge 8
          (cd release && sha256sum * | tee SHA256SUMS)
          test -s release/SHA256SUMS
      - name: Publish rolling cxx-nightly (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete cxx-nightly --yes || true
          git tag -f cxx-nightly
          git push -f origin cxx-nightly
          cat > /tmp/cxx-nightly-notes.md <<'MD'
# abliterate-cxx nightly

ISO C++26 lab for refusal-direction math. **No GPU, no Python** for the first hour.

## 10 minutes

```text
abliterate-cxx guide
abliterate-cxx doctor
abliterate-cxx demo
```

Then open `GETTING-STARTED.md` in the archive (repo: `docs/cxx26-researcher-guide.md`).

| Archive | Who |
|---------|-----|
| `abliterate-cxx-linux-x64-gcc15.tar.gz` | Linux x86_64 (default) |
| `abliterate-cxx-linux-x64-clang20.tar.gz` | Linux x86_64 Clang |
| `abliterate-cxx-linux-arm64-gcc15.tar.gz` | Linux aarch64 |
| `abliterate-cxx-windows-x64-msvc.zip` | Windows x64 (default) |
| `abliterate-cxx-windows-x64-clang.zip` | Windows x64 Clang |
| `abliterate-cxx-windows-arm64-msvc.zip` | Windows ARM64 |
| `abliterate-cxx-macos-arm64-llvm.tar.gz` | Apple Silicon |
| `abliterate-cxx-macos-x64-llvm.tar.gz` | Intel Mac |

Also `SHA256SUMS`. Each archive was unpacked on the runner and `doctor` + `demo` + estimate/apply/eval were run **outside the git checkout**.

`doctor` must print `cplusplus=202400`. Next: `recipes`, then Heretic for a real model.
MD
          gh release create cxx-nightly release/* \
            --prerelease \
            --title "abliterate-cxx nightly (all platforms)" \
            --notes-file /tmp/cxx-nightly-notes.md
      - name: Publish version tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --title "abliterate-cxx ${GITHUB_REF_NAME}" \
            --notes "Multi-platform ISO C++26 abliterate-cxx. docs/cxx26-platform.md"
