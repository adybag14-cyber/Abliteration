name: Publish interactive field guide

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out handbook
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test interactive guide
        run: npm run test:site

      - name: Validate handbook
        run: npm run validate

      - name: Build static site
        run: npm run build

      - name: Verify rendered desktop and mobile guide
        run: npm run test:e2e

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-guide-evidence
          path: artifacts/playwright
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Check out handbook for live audit
        uses: actions/checkout@v7

      - name: Set up Node for live audit
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Puppeteer live-audit dependencies
        run: npm ci

      - name: Audit deployed guide with Puppeteer
        env:
          LIVE_GUIDE_URL: ${{ steps.deployment.outputs.page_url }}
        run: npm run audit:live:puppeteer -- --url "$LIVE_GUIDE_URL"

      - name: Upload Puppeteer live evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: puppeteer-live-evidence
          path: artifacts/puppeteer-live
          if-no-files-found: error
          retention-days: 14
