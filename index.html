<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f4" />
    <meta
      name="description"
      content="A beautiful, interactive beginner's guide to reversible, evidence-led LLM abliteration."

    <meta property="og:title" content="Abliteration Field Guide" />

    <title>Abliteration Field Guide</title>
    <script>
      (() => {
        const stored = localStorage.getItem("abliteration-theme");
        const dark = stored === "dark" || (!stored && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>

    <div id="root"></div>
